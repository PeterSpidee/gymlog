<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover : on dessine sous l'encoche, les safe-area sont gérées en CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="GymLog — ton carnet de musculation, 100 % hors ligne.">

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>GymLog</title>
</head>
<body>
  <!-- Écran de démarrage (masqué une fois les données chargées) -->
  <div id="splash">
    <img src="icons/icon.svg" alt="" width="88" height="88">
    <span>GymLog</span>
  </div>

  <!-- Vue principale (onglets) -->
  <main id="views" aria-live="polite"></main>

  <!-- Barre "séance en cours" quand l'écran d'entraînement est réduit -->
  <div id="mini-bar" data-action="w-maximize"></div>

  <!-- Barre d'onglets -->
  <nav id="tabbar">
    <button class="tab" data-action="tab" data-tab="activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Activité</span>
    </button>
    <button class="tab" data-action="tab" data-tab="seances">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Séances</span>
    </button>
    <button class="tab" data-action="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M4.5 21c0-4.2 3.4-7.5 7.5-7.5s7.5 3.3 7.5 7.5"/></svg>
      <span>Progrès</span>
    </button>
  </nav>

  <!-- Pages empilées (sous-pages : stats, mensurations, éditeur…) -->
  <div id="pages"></div>

  <!-- Écran d'entraînement actif -->
  <div id="workout-root"></div>

  <!-- Feuilles modales (bottom sheets) -->
  <div id="sheet-root"></div>

  <!-- Notifications éphémères -->
  <div id="toast" role="status"></div>

  <script src="exercises.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
